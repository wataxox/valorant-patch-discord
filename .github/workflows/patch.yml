name: VALORANT Patch and Skin Notifications
on:
  schedule:
    - cron: '17 */6 * * *' # UTC: 6時間に1回
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: valorant-patch
  cancel-in-progress: false
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch, summarize and notify
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          POST_ON_FIRST_RUN: 'false'
        run: python bot.py
      - name: Save processed article URLs
        if: always()
        run: |
          if ! git diff --quiet -- data/state.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/state.json
            git commit -m 'chore: update published VALORANT patches'
            git push
          fi
